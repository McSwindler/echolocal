version: 2

git:
  ignore_tags:
    - boot-images
    - dev

before:
  hooks:
    - make vet
    - make test
    - make manifest

builds:
  - id: echoctl
    main: ./cmd/echoctl
    binary: echoctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ygelfand/echolocal/internal/layout.Version={{.Version}} -X github.com/ygelfand/echolocal/internal/layout.GitCommit={{.Commit}} -X github.com/ygelfand/echolocal/internal/layout.BuildDate={{.Date}}

archives:
  - formats: ["binary"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

release:
  prerelease: auto
  extra_files:
    # build-echod-all clears bin/echod-* first, so this is exactly what this build produced.
    - glob: ./bin/echod-*
    - glob: ./bin/manifest.json

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
